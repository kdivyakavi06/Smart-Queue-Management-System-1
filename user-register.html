<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Queue Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#87CEEB,#2563EB);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:900px;
    max-width:95%;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.left-panel{
    width:40%;
    background:#0F172A;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
}

.left-panel h1{
    font-size:40px;
    margin-bottom:15px;
}

.left-panel p{
    line-height:28px;
    font-size:16px;
}

.right-panel{
    width:60%;
    padding:40px;
}

.right-panel h2{
    text-align:center;
    color:#2563EB;
    margin-bottom:25px;
    font-size:30px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#333;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus{
    border-color:#2563EB;
    outline:none;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563EB;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#1D4ED8;
}

.token-box{
    margin-top:20px;
    display:none;
    text-align:center;
    padding:20px;
    border-radius:10px;
    background:#DBEAFE;
    border-left:6px solid #2563EB;
}

.token-box h3{
    color:#0F172A;
    line-height:30px;
}

</style>
</head>

<body>

<div class="container">

    <div class="left-panel">

        <h1>SQMS</h1>

        <p>
            SMART QUEUE MANAGEMENT SYSTEM
            <br><br>
            Reduce waiting time and manage
            customer queues efficiently.
        </p>

    </div>

    <div class="right-panel">

        <h2>User Registration</h2>

        <form id="registrationForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel"
                       id="mobile"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Service Required</label>

                <select id="service">
                    <option>General Service</option>
                    <option>Billing</option>
                    <option>Customer Support</option>
                    <option>Technical Support</option>
                </select>
            </div>

            <button type="submit" class="btn">
                GENERATE TOKEN
            </button>

        </form>

        <div class="token-box" id="tokenBox">
            <h3 id="tokenText"></h3>
        </div>

    </div>

</div>

<script>

document.getElementById("registrationForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    let tokenNumber =
        localStorage.getItem("token") || 100;

    tokenNumber++;

    localStorage.setItem("token", tokenNumber);

    document.getElementById("tokenBox")
    .style.display="block";

    document.getElementById("tokenText").innerHTML=
    `
    ✅ Registration Successful <br><br>

    Token Number : <b>${tokenNumber}</b><br>

    Status : <b>Waiting</b><br>

    Estimated Time : <b>15 Minutes</b>
    `;

    document.getElementById("registrationForm")
    .reset();

});

</script>

</body>
</html>
